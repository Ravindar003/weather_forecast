version: '3.8'

services:
  atmosense:
    build: .
    container_name: atmosense-forecaster
    environment:
      PYTHONUNBUFFERED: 1
      TZ: UTC
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./predictions_log.csv:/app/predictions_log.csv
      - ./atmosense.log:/app/atmosense.log
    ports:
      - "5000:5000"  # Reserved for future web dashboard
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - atmosense-network

networks:
  atmosense-network:
    driver: bridge
